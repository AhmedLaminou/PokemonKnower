{% extends "base.html" %}

{% block title %}AR Scanner - Pokémon Knower{% endblock %}

{% block extra_css %}
<style>
    .scanner-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        border-radius: var(--radius-lg);
        overflow: hidden;
        aspect-ratio: 3/4;
        background: #000;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    #videoElement {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* HUD Overlay */
    .hud-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        box-sizing: border-box;
        border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .reticle {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 250px;
        height: 250px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        box-shadow: 0 0 15px rgba(255, 203, 5, 0.3);
        transition: all 0.3s ease;
    }

    .reticle::before, .reticle::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border-color: var(--pokemon-yellow);
        border-style: solid;
        transition: all 0.3s ease;
    }

    .reticle::before {
        top: -2px;
        left: -2px;
        border-width: 4px 0 0 4px;
        border-radius: 4px 0 0 0;
    }

    .reticle::after {
        bottom: -2px;
        right: -2px;
        border-width: 0 4px 4px 0;
        border-radius: 0 0 4px 0;
    }

    .reticle-corner-tr {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 20px;
        height: 20px;
        border-top: 4px solid var(--pokemon-yellow);
        border-right: 4px solid var(--pokemon-yellow);
        border-radius: 0 4px 0 0;
    }

    .reticle-corner-bl {
        position: absolute;
        bottom: -2px;
        left: -2px;
        width: 20px;
        height: 20px;
        border-bottom: 4px solid var(--pokemon-yellow);
        border-left: 4px solid var(--pokemon-yellow);
        border-radius: 0 0 0 4px;
    }

    .scanning .reticle {
        border-color: var(--pokemon-yellow);
        box-shadow: 0 0 30px rgba(255, 203, 5, 0.6);
        animation: pulse-reticle 1.5s infinite;
    }

    @keyframes pulse-reticle {
        0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
    }

    .scan-line {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: rgba(255, 203, 5, 0.8);
        box-shadow: 0 0 10px var(--pokemon-yellow);
        animation: scan 2s linear infinite;
        display: none;
    }

    .scanning .scan-line {
        display: block;
    }

    @keyframes scan {
        0% { top: 10%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 90%; opacity: 0; }
    }

    /* Result Card */
    .ar-result-card {
        position: absolute;
        bottom: 20px;
        left: 20px;
        right: 20px;
        background: rgba(20, 20, 30, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: var(--radius-md);
        padding: 1rem;
        transform: translateY(120%);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        color: #fff;
    }

    .ar-result-card.show {
        transform: translateY(0);
    }

    .ar-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
    }

    .ar-name {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--pokemon-yellow);
    }

    .ar-confidence {
        font-size: 0.85rem;
        color: var(--text-muted);
        background: rgba(255,255,255,0.1);
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
    }

    .ar-stats {
        display: flex;
        gap: 1rem;
        font-size: 0.9rem;
        color: var(--text-secondary);
    }

    .ar-stat-item i {
        color: var(--type-electric);
        margin-right: 0.3rem;
    }

    .scan-controls {
        text-align: center;
        margin-top: 1.5rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
    }

    .scan-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--bg-card);
        border: 4px solid var(--border-color);
        color: var(--text-primary);
        font-size: 1.5rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .scan-btn:hover {
        border-color: var(--pokemon-yellow);
        color: var(--pokemon-yellow);
        transform: scale(1.1);
    }

    .scan-btn.active {
        background: var(--pokemon-yellow);
        border-color: var(--pokemon-yellow);
        color: #000;
        animation: pulse-btn 1.5s infinite;
    }

    @keyframes pulse-btn {
        0% { box-shadow: 0 0 0 0 rgba(255, 203, 5, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(255, 203, 5, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 203, 5, 0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="text-center mb-4">
            <h1 class="display-5 fw-bold gradient-text">AR Pokédex</h1>
            <p class="text-muted">Point your camera at a Pokémon to analyze it.</p>
        </div>

        <div class="scanner-container" id="scannerContainer">
            <video id="videoElement" autoplay playsinline></video>
            
            <div class="hud-overlay">
                <div class="reticle">
                    <div class="reticle-corner-tr"></div>
                    <div class="reticle-corner-bl"></div>
                    <div class="scan-line"></div>
                </div>
                
                <div class="ar-result-card" id="resultCard">
                    <div class="ar-header">
                        <div>
                            <span class="ar-name" id="pokemonName">Analyzing...</span>
                            <span class="badge bg-warning text-dark ms-2" id="shinyBadge" style="display: none; box-shadow: 0 0 10px gold;"><i class="fas fa-star"></i> SHINY</span>
                        </div>
                        <span class="ar-confidence" id="pokemonConfidence">--%</span>
                    </div>
                    <div class="ar-stats" id="pokemonStats">
                        <div class="ar-stat-item"><i class="fas fa-fist-raised"></i> <span id="statAtk">--</span></div>
                        <div class="ar-stat-item"><i class="fas fa-shield-alt"></i> <span id="statDef">--</span></div>
                        <div class="ar-stat-item"><i class="fas fa-bolt"></i> <span id="statSpd">--</span></div>
                    </div>
                    <div class="mt-2 text-end">
                        <a href="#" id="detailLink" class="btn btn-sm btn-outline-light rounded-pill">View Details <i class="fas fa-arrow-right ms-1"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="scan-controls">
            <button class="scan-btn" id="toggleScanBtn" title="Toggle Auto-Scan">
                <i class="fas fa-power-off"></i>
            </button>
            <button class="scan-btn" id="captureBtn" title="Capture & Analyze">
                <i class="fas fa-camera"></i>
            </button>
            <button class="scan-btn" id="switchCamBtn" title="Switch Camera">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
        
        <canvas id="canvas" style="display: none;"></canvas>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const toggleBtn = document.getElementById('toggleScanBtn');
    const captureBtn = document.getElementById('captureBtn');
    const switchBtn = document.getElementById('switchCamBtn');
    const container = document.getElementById('scannerContainer');
    const resultCard = document.getElementById('resultCard');
    
    let isScanning = false;
    let scanInterval = null;
    let currentStream = null;
    let usingFrontCamera = false;

    // Start Camera
    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
        
        const constraints = {
            video: {
                facingMode: usingFrontCamera ? "user" : "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            currentStream = stream;
            video.srcObject = stream;
        } catch (err) {
            console.error("Camera error:", err);
            alert("Could not access camera. Please allow permissions.");
        }
    }

    // Capture and Analyze
    async function analyzeFrame() {
        if (!currentStream) return;

        // Draw video frame to canvas
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        // Convert to Blob
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('file', blob, 'scan.jpg');

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.name && data.name !== 'Unknown') {
                    showResult(data);
                }
            } catch (err) {
                console.error("Analysis failed:", err);
            }
        }, 'image/jpeg', 0.8);
    }

    function showResult(data) {
        document.getElementById('pokemonName').textContent = data.name.toUpperCase();
        document.getElementById('pokemonConfidence').textContent = Math.round(data.confidence) + '%';
        
        // Shiny Handler
        const shinyBadge = document.getElementById('shinyBadge');
        if (data.is_shiny) {
            shinyBadge.style.display = 'inline-block';
            shinyBadge.classList.add('animate__animated', 'animate__pulse', 'animate__infinite');
            resultCard.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.5)';
            resultCard.style.border = '1px solid gold';
        } else {
            shinyBadge.style.display = 'none';
            shinyBadge.classList.remove('animate__animated', 'animate__pulse', 'animate__infinite');
            resultCard.style.boxShadow = '';
            resultCard.style.border = '';
        }
        
        if (data.pokemon) {
            document.getElementById('statAtk').textContent = data.pokemon.attack;
            document.getElementById('statDef').textContent = data.pokemon.defense;
            document.getElementById('statSpd').textContent = data.pokemon.speed;
            document.getElementById('detailLink').href = `/pokemon/${data.pokemon.number}`;
        }
        
        resultCard.classList.add('show');
        
        // Hide card after 5 seconds if not scanning
        if (!isScanning) {
            setTimeout(() => resultCard.classList.remove('show'), 5000);
        }
    }

    // Event Listeners
    toggleBtn.addEventListener('click', () => {
        isScanning = !isScanning;
        if (isScanning) {
            toggleBtn.classList.add('active');
            container.classList.add('scanning');
            // Scan every 2 seconds
            analyzeFrame(); // Immediate first scan
            scanInterval = setInterval(analyzeFrame, 2000);
        } else {
            toggleBtn.classList.remove('active');
            container.classList.remove('scanning');
            clearInterval(scanInterval);
            scanInterval = null;
        }
    });

    captureBtn.addEventListener('click', () => {
        container.classList.add('scanning');
        setTimeout(() => container.classList.remove('scanning'), 500);
        analyzeFrame();
    });

    switchBtn.addEventListener('click', () => {
        usingFrontCamera = !usingFrontCamera;
        startCamera();
    });

    // Init
    startCamera();

    // Cleanup
    window.addEventListener('beforeunload', () => {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }
    });
</script>
{% endblock %}
